[project]
name = "fantacalcio-py-main"
version = "0.1.0"
description = "Fantacalcio Python application"
authors = [
    {name = "marcoscattolin"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "pandas>=2.3.1",
    "loguru>=0.7.3",
    "tqdm>=4.67.1",
    "requests>=2.32.4",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.1.1",
    "pyarrow>=21.0.0",
    "fastparquet>=2024.11.0",
]

[project.optional-dependencies]
dev = [    
    
    # Code formatting and linting
    "ruff>=0.12.2",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    
    # Development tools
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
]

# ------------------ ruff -----------------------
[tool.ruff]
line-length = 88
include = ['\\.pyi?$']
exclude = [
    '\\.eggs',
    '\\.git',
    '\\.mypy_cache',
    '\\.tox',
    '\\.venv',
    'data',
    'sphinx',
    'dist',
    'docs',
    'notebooks',
    'sphinx',
    'venv'
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
